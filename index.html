<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gully Score</title>
<meta name="theme-color" content="#163A27">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F2EC; --card:#FFFFFF; --ink:#141414; --muted:#5C5B55; --line:#E1DFD6; --soft:#FAFAF6; --chip:#ECEBE3;
  --pitch:#163A27; --pitch2:#21513A; --ball:#D3F25B; --red:#C4302A; --tan:#80621F;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:20px 16px 96px;display:flex;flex-direction:column;gap:16px}
.app.nonav{padding-bottom:28px}
.hidden{display:none!important}
.sr{position:absolute;left:-9999px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1,.ph h1{margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:34px;letter-spacing:.3px;text-transform:uppercase;line-height:1}
.sub{color:var(--muted);font-size:14px;margin:-8px 0 0}
.ph{display:flex;align-items:center;gap:10px}
.ph .grow{flex:1;min-width:0}
.card{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.card h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 span{text-transform:none;letter-spacing:0;font-weight:500}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.inp,select.inp{height:50px;border-radius:14px;border:1px solid var(--line);background:var(--soft);padding:0 14px;font-size:16px;font-weight:600;color:var(--ink);outline:none;width:100%}
textarea.inp{height:auto;min-height:120px;padding:12px 14px;font-weight:500;resize:vertical}
.inp:focus{border-color:var(--pitch2);box-shadow:0 0 0 3px #21513A22}
.addrow{display:flex;gap:8px}
.addrow .inp{flex:1}
.addrow .btn{min-height:50px;padding:0 16px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stepper{display:flex;flex-direction:column;gap:6px}
.stepper .lbl{font-size:13px;font-weight:600;color:var(--muted)}
.stepper .ctl{display:flex;align-items:center;justify-content:space-between;height:52px;border:1px solid var(--line);border-radius:14px;background:var(--soft);padding:0 4px}
.stepper button{width:44px;height:44px;border-radius:11px;border:none;background:var(--chip);font-size:22px;font-weight:600}
.stepper output{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--chip);padding:4px;border-radius:14px}
.seg.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg button{min-height:44px;border:none;background:transparent;border-radius:10px;font-weight:600;font-size:15px;padding:0 6px}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 2px #0002}
.toggle{display:flex;align-items:center;gap:12px;min-height:48px;cursor:pointer}
.toggle .t{flex:1;display:flex;flex-direction:column;gap:2px}
.toggle .t b{font-size:15px;font-weight:600}
.toggle .t span{font-size:12.5px;color:var(--muted)}
.toggle input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:#C9C7BD;position:relative;flex-shrink:0;cursor:pointer;transition:background .15s;margin:0}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 2px #0003;transition:left .15s}
.toggle input:checked{background:var(--pitch2)}
.toggle input:checked::after{left:23px}
.toggle input:focus-visible{outline:2px solid var(--pitch2);outline-offset:2px}
.btn{min-height:56px;border-radius:16px;border:none;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;text-align:center}
.btn.primary{background:var(--pitch);color:#fff}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:600;font-size:15px;min-height:48px}
.btn.lime{background:var(--ball);color:var(--ink)}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{min-height:44px;font-size:14px;border-radius:12px}
.linkbtn{background:none;border:none;color:var(--muted);font-size:14px;text-decoration:underline;padding:10px 0;align-self:flex-start;font-weight:500}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.names{display:flex;flex-wrap:wrap;gap:8px}
.names button{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--soft);font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.names button[aria-pressed=true]{background:var(--pitch2);border-color:var(--pitch2);color:#fff}
.names button.mark{border-color:var(--tan);color:var(--tan)}
.names button small{font-weight:500;font-size:11.5px;opacity:.8}
.names .num{width:20px;height:20px;border-radius:10px;background:var(--ball);color:var(--ink);font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.empty{color:var(--muted);font-size:14px;line-height:1.5}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.tag.c{background:var(--ball);color:var(--ink)}

/* draft */
.turn{display:flex;align-items:center;gap:12px;background:var(--pitch);color:#fff;border-radius:14px;padding:10px 12px}
.turn .av{width:36px;height:36px;border-radius:18px;background:var(--ball);color:var(--ink);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.turn small{display:block;font-size:11.5px;color:#CFE3D6;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.turn b{font-size:16px}
.draft{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dcol{border:1.5px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:4px;min-height:96px}
.dcol.on{border-color:var(--pitch2);background:#21513A0D}
.dcol .dh{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 6px;font-size:14px;gap:6px}
.dcol .dh b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcol .dh span{font-weight:700;color:var(--muted)}
.dp{display:flex;justify-content:space-between;align-items:center;min-height:40px;padding:0 10px;border-radius:10px;background:var(--soft);border:1px solid #EEEDE6;font-weight:600;font-size:14px;width:100%;text-align:left;gap:6px}
.dp span{color:var(--muted);font-weight:500}
.dp.cap{background:#F4F8E4}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
.nav .in{max-width:480px;width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 4px 10px}
.nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);min-height:52px;justify-content:center;border-radius:12px}
.nav button[aria-current=page]{color:var(--pitch2)}
.nav button[aria-current=page] svg{background:#21513A1A;border-radius:10px}
.nav svg{padding:3px 12px;box-sizing:content-box}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 0;border-bottom:1px solid #EEEDE6;text-align:left;width:100%;background:none;border-left:none;border-right:none;border-top:none}
.li:last-child{border-bottom:none}
.li .av{width:40px;height:40px;border-radius:20px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.li .av.team{background:var(--pitch);color:var(--ball);border-radius:12px;font-family:'Barlow Condensed',sans-serif;font-size:20px}
.li .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li .tx b{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .tx small{color:var(--muted);font-size:12.5px}
.prow-edit{display:flex;align-items:center;gap:8px;min-height:56px;border-bottom:1px solid #EEEDE6}
.prow-edit:last-child{border-bottom:none}
.prow-edit .nm{flex:1;min-width:0;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow-edit select{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--soft);font-size:13px;padding:0 6px;max-width:112px}
.prow-edit .mini{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.prow-edit .mini[aria-pressed=true]{background:var(--ball);border-color:#BBD84A}

/* play */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.topbar .who{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.board{background:var(--pitch);color:#fff;border-radius:24px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.board .team{font-size:15px;font-weight:600;color:#CFE3D6}
.board .main{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.board .score{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:76px;line-height:.9;letter-spacing:-1px}
.board .ov{text-align:right;display:flex;flex-direction:column;gap:2px;padding-bottom:4px}
.board .ov b{font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:700;line-height:1}
.board .ov span{font-size:12px;color:#CFE3D6}
.board .info{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;color:#E6F0E9;border-top:1px solid #ffffff22;padding-top:10px}
.board .info b{color:var(--ball);font-weight:700}
.chase{background:var(--ball);color:var(--ink);border-radius:12px;padding:10px 12px;font-weight:700;font-size:16px;display:flex;justify-content:space-between;gap:8px}
.chase span{font-weight:500;font-size:13px;align-self:center}
.toss{font-size:13px;color:var(--muted);text-align:center;margin:-6px 0}
.freehit{background:var(--red);color:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.8px;align-self:flex-start}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px 14px;display:flex;flex-direction:column}
.prow{display:flex;align-items:center;justify-content:space-between;min-height:42px;font-size:15px;border-bottom:1px solid #EEEDE6;gap:8px}
.prow:last-child{border-bottom:none}
.prow .nm{font-weight:600;display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;white-space:nowrap}
.prow .nm i{font-style:normal;width:8px;height:8px;border-radius:4px;background:var(--pitch2);flex-shrink:0}
.prow .nm.off{font-weight:500;color:var(--muted)}
.prow .nm.off i{background:transparent}
.prow .fig{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.prow .fig small{font-weight:500;color:var(--muted);font-size:12.5px}
.prow.bowl{font-size:14px}
.prow.bowl .nm{font-weight:500}
.overbox{display:flex;flex-direction:column;gap:8px}
.overbox .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:40px}
.chip{min-width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;padding:0 8px;background:var(--card);border:1px solid var(--line)}
.chip.dot{color:var(--muted)}
.chip.bnd{background:var(--ball);border-color:var(--ball)}
.chip.w{background:var(--red);color:#fff;border-color:var(--red)}
.chip.x{border:1.5px dashed var(--tan);color:var(--tan);font-size:13px}
.chip.empty{background:transparent;border:1.5px dashed #CFCDC3}
.prev{font-size:13px;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pad button{height:68px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:700;box-shadow:0 2px 0 #E1DFD6;transition:transform .05s}
.pad button:active{transform:translateY(2px);box-shadow:none}
.pad button.bnd{background:var(--ball);border-color:#BBD84A;box-shadow:0 2px 0 #A9C43E}
.pad button.ext{font-family:Inter,sans-serif;font-size:16px;font-weight:700;color:var(--tan);border:1.5px solid #D9C9A6}
.pad button.ext[aria-pressed=true]{background:var(--tan);color:#fff;border-color:var(--tan)}
.pad button.wk{background:var(--red);color:#fff;border-color:var(--red);font-family:Inter,sans-serif;font-size:19px;box-shadow:0 2px 0 #922420;grid-column:span 2}
.pad button.five{font-size:16px;font-family:Inter,sans-serif;font-weight:600}
.hint{font-size:13px;color:var(--tan);font-weight:600;text-align:center;min-height:18px;margin:-4px 0}

/* scorecards */
table.sc{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.sc th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
table.sc th:first-child,table.sc td:first-child{text-align:left;padding-left:0}
table.sc td{padding:8px 4px;text-align:right;border-bottom:1px solid #EEEDE6;vertical-align:top}
table.sc td:first-child b{font-weight:600}
table.sc td small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:1px}
table.sc tr:last-child td{border-bottom:none}
table.sc tr.click{cursor:pointer}
.schead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.schead .t{font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center}
.schead b{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;white-space:nowrap}
.schead b small{font-family:Inter;font-size:13px;font-weight:500;color:var(--muted)}
.meta{font-size:13px;color:var(--muted);line-height:1.5}
.meta b{color:var(--ink);font-weight:600}
.big{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:44px;line-height:1;margin:0;text-transform:uppercase}
.resultline{background:var(--ball);border-radius:16px;padding:16px;font-weight:700;font-size:20px;text-align:center}
.star{background:var(--pitch);color:#fff;border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.star .st{display:flex;flex-direction:column;gap:2px}
.star small{color:#CFE3D6;font-size:12px;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.star b{font-size:18px}
.star span{font-size:13px;color:#E6F0E9}
.bars{display:flex;flex-direction:column;gap:12px}
.bars .bt{font-size:13px;font-weight:600}
.bars .cols{display:flex;align-items:flex-end;gap:4px;height:80px}
.bars .col{flex:1;max-width:44px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;min-width:0}
.bars .bar{width:100%;border-radius:5px 5px 2px 2px;background:var(--pitch2);min-height:3px}
.bars .bar.b2{background:#B9A06A}
.bars .bar.wk{box-shadow:inset 0 3px 0 var(--red)}
.bars .col span{font-size:11px;color:var(--muted)}
.comm{display:flex;flex-direction:column}
.comm .oh{font-size:12.5px;font-weight:700;color:var(--muted);background:var(--bg);padding:8px 10px;border-radius:10px;margin:8px 0 4px;display:flex;justify-content:space-between}
.comm .cb{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #EEEDE6;font-size:14px;line-height:1.4}
.comm button.cb{width:100%;background:none;border:none;border-bottom:1px solid #EEEDE6;text-align:left;align-items:flex-start;cursor:pointer;font-size:14px}
.comm .cb .dx{flex:1}
.comm .cb .ed{font-size:11.5px;color:var(--muted);font-weight:600;padding-top:3px}
button.chip{cursor:pointer;font-family:inherit}
.pad button.sixout{background:var(--red);color:#fff;border-color:var(--red);font-family:Inter,sans-serif;font-size:16px;box-shadow:0 2px 0 #922420}
.freehit.hat{background:var(--pitch);color:var(--ball)}
.prow .nm em.ms{font-style:normal;font-size:11.5px;font-weight:600;color:var(--tan);background:#F4EBD6;padding:2px 7px;border-radius:999px}
.comm .cb .n{width:34px;flex-shrink:0;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;padding-top:1px}
.comm .cb .ball{width:30px;height:24px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--chip)}
.comm .cb .ball.bnd{background:var(--ball)}
.comm .cb .ball.w{background:var(--red);color:#fff}
.comm .cb .ball.x{background:#F1E8D4;color:var(--tan)}
.hero{display:flex;align-items:center;gap:14px}
.hero .av.big{width:68px;height:68px;border-radius:34px;background:var(--pitch);color:var(--ball);font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hero .hx{display:flex;flex-direction:column;gap:4px;min-width:0}
.hero h1{margin:0;font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:800;line-height:1;text-transform:uppercase}
.hero .hx>span{font-size:13.5px;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.tag.dark{background:var(--pitch);color:var(--ball)}
.statgrid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.form{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:0;text-transform:none}
.form.hot{background:var(--ball);color:var(--ink)}
.form.cold{background:#F6DEDC;color:var(--red)}
.form.ok{background:var(--chip);color:var(--ink)}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px}
.stack i{display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:12.5px;color:var(--muted);font-weight:500}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.res{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.res.W{background:var(--ball);color:var(--ink)}.res.L{background:#F6DEDC;color:var(--red)}.res.T{background:var(--chip);color:var(--muted)}
table.cmp td{font-weight:600;font-size:15px}
table.cmp td.win{color:var(--pitch2);font-weight:800}
table.cmp td.win::after{content:" \25B2";font-size:10px}
.hero .av.big{position:relative}
.hero .av .rt{position:absolute;right:-6px;bottom:-4px;background:var(--ball);color:var(--ink);font-family:Inter,sans-serif;font-size:12px;font-weight:800;border-radius:999px;padding:2px 7px;border:2px solid var(--bg)}
.badgegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bdg{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:10px;position:relative}
.bdg .ic{width:34px;height:34px;border-radius:17px;background:var(--pitch);color:var(--ball);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
.bdg b{font-size:13px;font-weight:600;line-height:1.25}
.bdg .ct{position:absolute;top:6px;right:8px;font-size:12px;font-weight:700;color:var(--muted)}
.bdg.dud .ic{background:#F6DEDC;color:var(--red)}
.res.J{background:#E6E0F5;color:#4B3B8F}
.h2h{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px}

<script>
(function(){
var DBK = 'gullyScore.db.v3';
var DB = null;
try { DB = JSON.parse(localStorage.getItem(DBK)); } catch(e) {}
if (!DB || !DB.teams) DB = { teams:[], matches:[], live:null, undo:[], rules:{ overs:5, extraRun:true, rebowl:true, freeHit:true, lastMan:false } };
if (!DB.pool) DB.pool = [];
if (!DB.prefs) DB.prefs = { outdoor:false, voice:false };
if (DB.prefs.liveShare == null) DB.prefs.liveShare = true;
if (!DB.tours) DB.tours = [];
if (!DB.kitty) DB.kitty = { tx:[], cols:[] };
function wipeStats(o){ o = o || {}; DB.matches = []; DB.live = null; DB.undo = []; if (o.tours !== false) DB.tours = []; if (o.kitty !== false) DB.kitty = { tx:[], cols:[] }; DB.wiped1 = true; }
var JUST_WIPED = false;
if (!DB.wiped1) { JUST_WIPED = DB.matches.length > 0 || !!DB.live || DB.tours.length > 0 || DB.kitty.tx.length > 0; wipeStats(); try { localStorage.setItem(DBK, JSON.stringify(DB)); } catch(e) {} }
(function(R){ if (R.retireAt == null) R.retireAt = 0; if (R.maxOv == null) R.maxOv = 0; if (R.sixOut == null) R.sixOut = false; if (R.noLbw == null) R.noLbw = true; })(DB.rules);
(function(){ var ids = {}; DB.pool.forEach(function(p){ ids[p.id] = 1; }); DB.teams.forEach(function(t){ t.players.forEach(function(p){ if (!ids[p.id]) { ids[p.id] = 1; DB.pool.push({ id:p.id, name:p.name, role:p.role || '' }); } }); }); })();
var CL = { on:false, db:null, uid:null, last:null, busy:false, again:false, sent:{}, core:'', hold:false, remote:null, err:'', dl:null };
var UI = { tab:'match', team:null, hist:null, setup:null, pick:[], statTab:'bat', statTeam:'all', bulk:false };

var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pl(n, w){ return n + ' ' + w + (n === 1 ? '' : 's'); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function ovStr(n){ return Math.floor(n/6) + '.' + (n%6); }
function save(){
  if (DB.undo.length > 150) DB.undo = DB.undo.slice(-150);
  try { localStorage.setItem(DBK, JSON.stringify(DB)); } catch(e) { toast('Could not save: phone storage is full'); }
  if (typeof schedSync === 'function') schedSync();
  if (typeof schedLive === 'function') schedLive();
}
function vib(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e) {} }
var toastT;
function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.add('hidden'); }, 2200); }
function sheet(html){ $('sheet').innerHTML = html; $('scrim').classList.remove('hidden'); var f = $('sheet').querySelector('input,button'); if (f) f.focus(); }
function closeSheet(){ $('scrim').classList.add('hidden'); $('sheet').innerHTML = ''; }
function confirmSheet(title, msg, okLabel, danger, act, extra){
  var attrs = ''; extra = extra || {}; Object.keys(extra).forEach(function(k){ attrs += ' data-' + k + '="' + esc(extra[k]) + '"'; });
  sheet('<h3 id="sheetTitle">' + esc(title) + '</h3><p>' + esc(msg) + '</p><div class="acts"><button class="btn ghost" data-act="close" type="button">Cancel</button><button class="btn ' + (danger ? 'danger' : 'primary') + '" data-act="' + act + '"' + attrs + ' type="button">' + esc(okLabel) + '</button></div>');
}
var lock = null;
function keepAwake(){ try { if (navigator.wakeLock && !lock) navigator.wakeLock.request('screen').then(function(l){ lock = l; l.addEventListener('release', function(){ lock = null; }); }, function(){}); } catch(e) {} }
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible' && DB.live && DB.live.phase === 'play') keepAwake(); });

/* ================= teams ================= */
function teamById(id){ for (var i = 0; i < DB.teams.length; i++) if (DB.teams[i].id === id) return DB.teams[i]; return null; }
var ROLES = ['', 'Batter', 'Bowler', 'All-rounder', 'Keeper'];
function findPlayer(pid){
  for (var i = 0; i < DB.pool.length; i++) if (DB.pool[i].id === pid) return DB.pool[i];
  for (var j = 0; j < DB.teams.length; j++) for (var k = 0; k < DB.teams[j].players.length; k++) if (DB.teams[j].players[k].id === pid) return DB.teams[j].players[k];
  return null;
}
function poolAdd(name){
  name = String(name || '').trim().replace(/\s+/g, ' ').slice(0, 24);
  if (!name) return null;
  var ex = DB.pool.filter(function(p){ return p.name.toLowerCase() === name.toLowerCase(); })[0];
  if (ex) return ex;
  var p = { id:uid(), name:name, role:'' }; DB.pool.push(p); return p;
}
function initials(n){ var p = String(n).trim().split(/\s+/); return ((p[0] || '?')[0] + (p[1] ? p[1][0] : '')).toUpperCase(); }

/* ================= match rules ================= */
var CREDIT = { 'Bowled':1, 'Caught':1, 'One tip one hand':1, 'Wall catch':1, 'LBW':1, 'Stumped':1, 'Hit wicket':1, 'Hit over the wall':1 };
var NEEDS_FIELDER = { 'Caught':1, 'One tip one hand':1, 'Wall catch':1, 'Run out':1, 'Stumped':1 };
function howList(m, x){ if (x === 'wd') return ['Stumped', 'Hit wicket']; return ['Bowled', 'Caught', 'One tip one hand', 'Wall catch', 'Hit over the wall', 'LBW', 'Stumped', 'Hit wicket'].filter(function(h){ return !(h === 'LBW' && m.cfg.noLbw); }); }
function isLegal(m, b){ return !(b.x === 'wd' || b.x === 'nb') || !m.cfg.rebowl; }
function pen(m, b){ return (b.x === 'wd' || b.x === 'nb') && m.cfg.extraRun ? 1 : 0; }
function tot(m, b){ return b.r + pen(m, b); }
function batRuns(b){ return (b.x === 'wd' || b.x === 'b') ? 0 : b.r; }
function bowlRuns(m, b){ return tot(m, b) - (b.x === 'b' ? b.r : 0); }
function xRuns(m, b){ return pen(m, b) + ((b.x === 'wd' || b.x === 'b') ? b.r : 0); }
function batTeam(m, i){ return m.teams[m.inn[i].bat]; }
function fieldTeam(m, i){ return m.teams[1 - m.inn[i].bat]; }
function nm(m, pid){ return pid == null ? '' : (m.names[pid] || 'Player'); }
function nXI(m, i){ return batTeam(m, i).xi.length; }
function maxB(m, i){ return m.inn[i].sup ? 6 : m.cfg.overs * 6; }
function maxW(m, i){ var n = nXI(m, i); return m.inn[i].sup ? Math.min(2, n - 1) : (m.cfg.lastMan ? n : n - 1); }
function newInn(bat, sup){ return { bat:bat, sup:!!sup, balls:[], order:[], st:null, ns:null, bw:null, out:{}, ret:{} }; }

function stats(m, i){
  var s = { runs:0, wkts:0, legal:0, ext:0, overs:[[]], fow:[], pR:0, pB:0 };
  var inn = m.inn[i]; if (!inn) return s;
  inn.balls.forEach(function(b){
    var t = tot(m, b);
    s.runs += t; s.ext += xRuns(m, b); s.pR += t;
    s.overs[s.overs.length - 1].push(b);
    var lg = isLegal(m, b);
    if (lg) { s.legal++; s.pB++; }
    if (b.w) { s.wkts++; s.fow.push({ sc:s.runs, w:s.wkts, pid:b.o, ov:ovStr(s.legal) }); s.pR = 0; s.pB = 0; }
    if (lg && s.legal % 6 === 0) s.overs.push([]);
  });
  return s;
}
function target(m, i){ return stats(m, i - 1).runs + 1; }
function innDone(m, i){
  var s = stats(m, i);
  if (s.wkts >= maxW(m, i) || s.legal >= maxB(m, i)) return true;
  if (i % 2 === 1 && s.runs >= target(m, i)) return true;
  return false;
}
function yetToBat(m, i){ var inn = m.inn[i]; return batTeam(m, i).xi.filter(function(p){ return inn.order.indexOf(p) < 0; }); }
function freeHitNow(m){
  if (!m.cfg.freeHit) return false;
  var b = m.inn[m.cur].balls;
  for (var k = b.length - 1; k >= 0; k--) { if (b[k].x === 'nb') return true; if (b[k].x === 'wd') continue; return false; }
  return false;
}
function batStats(m, i){
  var inn = m.inn[i], o = {};
  inn.order.forEach(function(p){ o[p] = { pid:p, r:0, b:0, f4:0, f6:0, out:inn.out[p] || null, ret:inn.ret[p] || false }; });
  inn.balls.forEach(function(b){
    if (b.s == null || !o[b.s] || b.x === 'wd') return;
    var p = o[b.s], r = batRuns(b); p.b++; p.r += r; if (r === 4) p.f4++; if (r === 6) p.f6++;
  });
  return inn.order.map(function(p){ return o[p]; });
}
function bowlStats(m, i){
  var inn = m.inn[i], o = {}, list = [];
  function get(p){ if (!o[p]) { o[p] = { pid:p, lg:0, r:0, w:0, dots:0, md:0 }; list.push(o[p]); } return o[p]; }
  inn.balls.forEach(function(b){
    if (b.bw == null) return;
    var p = get(b.bw), lg = isLegal(m, b), br = bowlRuns(m, b);
    if (lg) p.lg++;
    p.r += br;
    if (b.w && CREDIT[b.how]) p.w++;
    if (lg && br === 0 && !b.w) p.dots++;
  });
  stats(m, i).overs.forEach(function(ov){
    var lg = ov.filter(function(b){ return isLegal(m, b); }).length;
    if (lg !== 6) return;
    var bw = ov[0].bw, same = ov.every(function(b){ return b.bw === bw; });
    var r = ov.reduce(function(s, b){ return s + bowlRuns(m, b); }, 0);
    if (same && bw != null && r === 0 && o[bw]) o[bw].md++;
  });
  if (inn.bw != null) get(inn.bw);
  return list;
}
function dismissal(m, i, p){
  if (p.ret) return p.ret === 'limit' ? 'retired (run limit)' : 'retired hurt';
  if (!p.out) return 'not out';
  var d = p.out, b = d.by != null ? nm(m, d.by) : '', f = d.f != null ? nm(m, d.f) : '';
  switch (d.how) {
    case 'Bowled': return 'b ' + b;
    case 'Caught': return (f ? 'c ' + f + ' ' : 'caught ') + 'b ' + b;
    case 'One tip one hand': return 'one tip one hand' + (f ? ', c ' + f : '') + ' b ' + b;
    case 'Wall catch': return 'wall catch' + (f ? ', c ' + f : '') + ' b ' + b;
    case 'LBW': return 'lbw b ' + b;
    case 'Stumped': return (f ? 'st ' + f + ' ' : 'stumped ') + 'b ' + b;
    case 'Hit wicket': return 'hit wicket b ' + b;
    case 'Hit over the wall': return 'hit over the wall b ' + b;
    case 'Run out': return 'run out' + (f ? ' (' + f + ')' : '');
  }
  return d.how;
}
function mainPair(m){ return m.inn.length > 2 ? [2, 3] : [0, 1]; }
function winner(m){
  var a = stats(m, 0).runs, b = stats(m, 1).runs;
  if (a !== b) return a > b ? m.inn[0].bat : m.inn[1].bat;
  if (m.inn.length > 2 && m.inn[3]) { var c = stats(m, 2).runs, d = stats(m, 3).runs; if (c !== d) return c > d ? m.inn[2].bat : m.inn[3].bat; }
  return -1;
}
function resultText(m){
  var a = stats(m, 0), b = stats(m, 1);
  if (b.runs > a.runs) { var w = maxW(m, 1) - b.wkts, left = maxB(m, 1) - b.legal; return batTeam(m, 1).name + ' won by ' + pl(w, 'wicket') + (left > 0 ? ' (' + pl(left, 'ball') + ' left)' : ''); }
  if (a.runs > b.runs) return batTeam(m, 0).name + ' won by ' + pl(a.runs - b.runs, 'run');
  if (m.inn.length > 3) {
    var c = stats(m, 2).runs, d = stats(m, 3).runs;
    if (c > d) return batTeam(m, 2).name + ' won the super over';
    if (d > c) return batTeam(m, 3).name + ' won the super over';
    return 'Super over tied too! Match tied';
  }
  return 'Match tied!';
}
function star(m){
  var pts = {}, best = null;
  function g(p, t){ if (!pts[p]) pts[p] = { pid:p, team:t, r:0, b:0, w:0, rc:0, ct:0, s:0 }; return pts[p]; }
  m.inn.forEach(function(inn, i){
    batStats(m, i).forEach(function(p){ var x = g(p.pid, batTeam(m, i).name); x.r += p.r; x.b += p.b; x.s += p.r + p.f4 + p.f6 * 2; });
    bowlStats(m, i).forEach(function(p){ var x = g(p.pid, fieldTeam(m, i).name); x.w += p.w; x.rc += p.r; x.s += p.w * 15 + p.dots + p.md * 5; });
    inn.balls.forEach(function(b){ if (b.w && b.f != null) { var x = g(b.f, fieldTeam(m, i).name); x.ct++; x.s += 5; } });
  });
  Object.keys(pts).forEach(function(k){ if (!best || pts[k].s > best.s) best = pts[k]; });
  if (!best || best.s <= 0) return null;
  var bits = [];

    save(); closeSheet(); render();
  },
  mEnd: function(){ confirmSheet('End innings?', 'Use this if the match is cut short. You can undo it.', 'End innings', false, 'mEndYes'); },
  mEndYes: function(){ snap(); endInnings(M()); save(); closeSheet(); render(); },
  mRules: function(){
    var c = M().cfg;
    sheet('<h3 id="sheetTitle">Match rules</h3><p>' + pl(c.overs, 'over') + '<br>Extras give a run: ' + (c.extraRun ? 'Yes' : 'No') + '<br>Re-bowl wides &amp; no-balls: ' + (c.rebowl ? 'Yes' : 'No') + '<br>Free hit: ' + (c.freeHit ? 'Yes' : 'No') + '<br>Last man bats alone: ' + (c.lastMan ? 'Yes' : 'No') + '</p><button class="btn primary" type="button" data-act="close">Got it</button>');
  },
  mQuit: function(){ confirmSheet('Abandon match?', 'This match will be deleted and not counted in stats.', 'Abandon', true, 'mQuitYes'); },
  mQuitYes: function(){ stopLive(); DB.live = null; DB.undo = []; UI.setup = null; save(); closeSheet(); render(); },

  statTab: function(d){ UI.statTab = d.t; render(); },
  player: function(d){ closeSheet(); UI.player = d.pid; UI.cmp = null; render(); },
  backPlayer: function(){ UI.player = null; UI.cmp = null; render(); },
  openHist: function(d){ UI.player = null; UI.tab = 'history'; UI.hist = d.id; UI.histComm = 0; render(); },
  backHist: function(){ UI.hist = null; render(); },
  histComm: function(d){ UI.histComm = +d.i; var y = window.scrollY; render(); window.scrollTo(0, y); },
  delMatch: function(){ confirmSheet('Delete this match?', 'It will be removed from history and stats.', 'Delete', true, 'delMatchYes'); },
  delMatchYes: function(){ DB.matches = DB.matches.filter(function(x){ return x.id !== UI.hist; }); UI.hist = null; save(); closeSheet(); render(); }
};
function showCode(json){ sheet('<h3 id="sheetTitle">Backup code</h3><p>Select all and copy it somewhere safe.</p><textarea class="inp" readonly style="min-height:160px;font-size:12px">' + esc(json) + '</textarea><button class="btn primary" type="button" data-act="close">Done</button>'); }
function coinNames(){
  if (UI.coin && UI.coin.ctx === 'tour') { var t = tourById(UI.tour), f = t.fx.filter(function(x){ return x.id === UI.tt.fid; })[0]; return [tTeam(t, f.a).name, tTeam(t, f.b).name]; }
  var sp = setupSpec(); return sp.teams ? [sp.teams[0].name, sp.teams[1].name] : ['Team 1', 'Team 2'];
}
function coinAfterHTML(){
  var c = UI.coin, n = coinNames();
  return '<div class="field" style="font-size:13px;font-weight:600;color:var(--muted)">Who won the toss?</div><div class="seg">' + [0, 1].map(function(k){ return '<button type="button" data-act="coinW" data-v="' + k + '" aria-pressed="' + (c.w === k) + '">' + esc(n[k]) + '</button>'; }).join('') + '</div>' +
    '<div class="field" style="font-size:13px;font-weight:600;color:var(--muted)">' + (c.w == null ? 'They chose to' : esc(n[c.w]) + ' chose to') + '</div><div class="seg"><button type="button" data-act="coinC" data-v="bat" aria-pressed="' + (c.c === 'bat') + '">Bat</button><button type="button" data-act="coinC" data-v="bowl" aria-pressed="' + (c.c === 'bowl') + '">Bowl</button></div>' +
    '<div class="acts"><button class="btn ghost" type="button" data-act="coinAgain">Flip again</button><button class="btn primary" type="button" data-act="coinDone"' + (c.w == null ? ' disabled' : '') + '>Done</button></div>';
}
function coinSheet(ctx){
  var heads = Math.random() < .5, res = heads ? 'Heads' : 'Tails';
  var prev = UI.coin && UI.coin.ctx === ctx ? UI.coin : null;
  UI.coin = { ctx:ctx, res:res, w:prev ? prev.w : null, c:prev ? prev.c : 'bat' };
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var end = (heads ? 1800 : 1980) + (Math.random() < .5 ? 0 : 360);
  sheet('<h3 id="sheetTitle">Coin toss</h3><div class="coinwrap"><div class="coinshadow"></div><div class="coin" style="--end:' + end + 'deg"><div class="face h"><b>H</b><small>Heads</small></div><div class="face t"><b>T</b><small>Tails</small></div></div></div>' +
    '<p class="coinres" id="coinRes" aria-live="polite">Flipping\u2026</p><div id="coinAfter" style="display:flex;flex-direction:column;gap:12px;opacity:0;visibility:hidden;transition:opacity .25s">' + coinAfterHTML() + '</div>');
  setTimeout(function(){
    var r = $('coinRes'), af = $('coinAfter'); if (!r || !af || UI.coin.res !== res) return;
    r.innerHTML = '<b>' + res.toUpperCase() + '!</b>';
    af.innerHTML = coinAfterHTML(); af.style.visibility = 'visible'; af.style.opacity = 1;
    vib([30, 40, 60]);
  }, reduce ? 50 : 1750);
}
function tossSheet(){
  var t = tourById(UI.tour), f = t && t.fx.filter(function(x){ return x.id === UI.tt.fid; })[0]; if (!f) return;
  var n = [tTeam(t, f.a).name, tTeam(t, f.b).name];
  sheet('<h3 id="sheetTitle">' + esc(n[0]) + ' vs ' + esc(n[1]) + '</h3><p>' + STAGE[f.st] + ' · ' + pl(t.overs, 'over') + ' a side</p><div class="field" style="font-size:13px;font-weight:600;color:var(--muted)">Who won the toss?</div><div class="seg">' + [0, 1].map(function(k){ return '<button type="button" data-act="tT" data-v="' + k + '" aria-pressed="' + (UI.tt.w === k) + '">' + esc(n[k]) + '</button>'; }).join('') + '</div>' +
    '<div class="field" style="font-size:13px;font-weight:600;color:var(--muted)">They chose to</div><div class="seg"><button type="button" data-act="tC" data-v="bat" aria-pressed="' + (UI.tt.c === 'bat') + '">Bat</button><button type="button" data-act="tC" data-v="bowl" aria-pressed="' + (UI.tt.c === 'bowl') + '">Bowl</button></div><button class="linkbtn" type="button" data-act="tFlip">Flip a coin</button>' +
    '<div class="acts"><button class="btn ghost" type="button" data-act="close">Cancel</button><button class="btn primary" type="button" data-act="tPlayGo">Start match</button></div>');
}
function kcPreview(total, n){ return !n ? '<span>Pick who pays below</span>' : !(total > 0) ? '<span>Enter the total amount</span>' : '<span style="text-align:left">Split between <b>' + n + '</b> = <b>' + eachText(Math.round(total), n) + '</b></span>'; }
function kcSheet(){
  var c = UI.kc;
  sheet('<h3 id="sheetTitle">New collection</h3><label class="field">What for?<input class="inp" id="kcT" type="text" maxlength="30" value="' + esc(c.t) + '"></label><label class="field">Total to collect (\u20b9)<input class="inp" id="kcA" type="number" inputmode="numeric" min="1" value="' + esc(c.a) + '"></label>' +
    '<div class="h2h" id="kcPrev" aria-live="polite">' + kcPreview(+c.a, c.who.length) + '</div>' +
    '<div class="field" style="font-size:13px;font-weight:600;color:var(--muted)">Who pays? (' + c.who.length + ')</div><div class="names">' + DB.pool.map(function(p){ return '<button type="button" data-act="kcW" data-pid="' + esc(p.id) + '" aria-pressed="' + (c.who.indexOf(p.id) >= 0) + '">' + esc(p.name) + '</button>'; }).join('') + '</div><button class="linkbtn" type="button" data-act="kcAll">' + (c.who.length === DB.pool.length ? 'Clear all' : 'Select everyone') + '</button>' +
    '<div class="acts"><button class="btn ghost" type="button" data-act="close">Cancel</button><button class="btn primary" type="button" data-act="kColGo">Create</button></div>');
}
function scSheet(){
  var m = M(), t = UI.scTab, h = '<h3 id="sheetTitle">Scorecard</h3><div class="seg"><button type="button" data-act="scTab" data-t="card" aria-pressed="' + (t === 'card') + '">Scorecard</button><button type="button" data-act="scTab" data-t="balls" aria-pressed="' + (t === 'balls') + '">Ball by ball</button></div>';
  if (t === 'card') { for (var i = m.cur; i >= 0; i--) h += scHTML(m, i, false); if (m.cur >= 1 && m.inn[1].balls.length) h += wormHTML(m); }
  else h += '<p class="empty" style="margin:0">Tap any ball to fix it.</p>' + commHTML(m, m.cur, 'live');
  sheet(h + '<button class="btn primary" type="button" data-act="close">Close</button>');
}
function fallbackCopy(txt){
  sheet('<h3 id="sheetTitle">Copy this</h3><p style="white-space:pre-line;color:var(--ink);user-select:all;background:var(--bg);padding:12px;border-radius:12px">' + esc(txt) + '</p><button class="btn primary" type="button" data-act="close">Done</button>');
}

document.addEventListener('click', function(e){
  if (e.target === $('scrim')) return closeSheet();
  var t = e.target.closest('[data-act]'); if (!t) return;
  var fn = ACT[t.dataset.act]; if (fn) fn(t.dataset, t, e);
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && !$('scrim').classList.contains('hidden')) return closeSheet();
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter) { e.preventDefault(); var fn = ACT[e.target.dataset.enter]; if (fn) fn(e.target.dataset, e.target, e); }
});
document.addEventListener('input', function(e){ if (e.target.id === 'kcA' && UI.kc) { var el = $('kcPrev'); if (el) el.innerHTML = kcPreview(+e.target.value, UI.kc.who.length); } });
document.addEventListener('change', function(e){
  var t = e.target;
  if (t.id === 'fileIn' && t.files && t.files[0]) { var fr = new FileReader(); fr.onload = function(){ offerRestore(fr.result); }; fr.readAsText(t.files[0]); t.value = ''; return; }
  var k = t.dataset && t.dataset.chg; if (!k) return;
  if (k === 'pref') { DB.prefs[t.dataset.k] = t.checked; save(); render(); if (t.dataset.k === 'liveShare') { if (t.checked) schedLive(); else stopLive(); } return; }
  if (k === 'rule') { DB.rules[t.dataset.k] = t.checked; save(); render(); }
  else if (k === 'setTeam') { var s = UI.setup, side = +t.dataset.side; s.t[side] = t.value; var tm = teamById(t.value); s.xi[side] = tm.players.map(function(p){ return p.id; }); if (s.t[0] === s.t[1]) { var o = DB.teams.filter(function(x){ return x.id !== t.value; })[0]; if (o) { s.t[1 - side] = o.id; s.xi[1 - side] = o.players.map(function(p){ return p.id; }); } } render(); }
  else if (k === 'renameTeam') { var tm2 = teamById(UI.team), v = t.value.trim().slice(0, 24); if (v) { tm2.name = v; save(); render(); } }
  else if (k === 'role') { var tm3 = teamById(UI.team); tm3.players.forEach(function(p){ if (p.id === t.dataset.pid) p.role = t.value; }); save(); }
  else if (k === 'statTeam') { UI.statTeam = t.value; render(); }
  else if (k === 'period') { UI.period = t.value; render(); }
  else if (k === 'tnName') { tnewDraft().name = t.value; }
  else if (k === 'tnCap') { var n = tnewDraft(), tk = n.teams[+t.dataset.k]; tk.cap = t.value || null; n.teams.forEach(function(x){ var q = x.ps.indexOf(tk.cap); if (q >= 0) x.ps.splice(q, 1); }); render(); }
  else if (k === 'cmp') { UI.cmp = t.value || null; var y = window.scrollY; render(); window.scrollTo(0, y); }
  else if (k === 'joker') { var Dj = UI.setup.d; Dj.joker = t.value || null; [0, 1].forEach(function(s2){ var j = Dj.picks[s2].indexOf(Dj.joker); if (j > 0) Dj.picks[s2].splice(j, 1); }); render(); }
  else if (k === 'cap') { var D = UI.setup.d, side2 = +t.dataset.side; D.caps[side2] = t.value || null; D.picks = [D.caps[0] ? [D.caps[0]] : [], D.caps[1] ? [D.caps[1]] : []]; D.hist = []; D.turn = D.first || 0; if (D.caps.indexOf(D.joker) >= 0) D.joker = null; render(); }
  else if (k === 'poolRole') { var pp = findPlayer(t.dataset.pid); if (pp) pp.role = t.value; DB.teams.forEach(function(tm){ tm.players.forEach(function(x){ if (x.id === t.dataset.pid) x.role = t.value; }); }); save(); }
});

if (DB.live && DB.live.phase === 'play') keepAwake();
render();
if (JUST_WIPED) setTimeout(function(){ toast('Test matches and stats cleared. Your players are kept.'); }, 400);
})();
</script>

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) { window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
